<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | MOVELTY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <script src="js/auth.js"></script>
    <style>
        .login-page { min-height: 100vh; display: flex; flex-direction: column; }
        .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; background: linear-gradient(135deg, #0b5394, #1A73E8, #42A5F5); }
        .login-card { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); padding: 40px 36px; width: 100%; max-width: 380px; text-align: center; }
        .login-logo { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #0b5394, #1A73E8); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:700; margin: 0 auto 16px; }
        .login-card h1 { font-size: 1.4rem; margin-bottom: 4px; }
        .login-card p.sub { color: var(--text-light); font-size: 0.9rem; margin-bottom: 24px; }
        .login-field { text-align: left; margin-bottom: 16px; }
        .login-field label { display: block; font-size: 0.85rem; color: var(--text-light); margin-bottom: 6px; }
        .login-field input { width: 100%; padding: 12px 14px; border: 1px solid rgba(11,83,148,0.25); border-radius: 8px; font-size: 1rem; transition: border-color .2s; }
        .login-field input:focus { outline: none; border-color: var(--ps-primary); }
        .login-error { display: none; background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; margin-bottom: 16px; }
        .login-btn { width: 100%; padding: 13px; border: none; border-radius: 8px; background: linear-gradient(135deg, #E65100, #FF6B00); color:#fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity .2s; }
        .login-btn:hover { opacity: 0.9; }
        .login-footer-text { margin-top: 20px; font-size: 0.8rem; color: var(--text-light); }
    </style>
</head>
<body>
    <div class="login-page">
        <main class="login-main">
            <div class="login-card">
                <div class="login-logo"><img src="images/logotipo-movelty.png" alt="Movelty" style="width:100%;height:100%;object-fit:contain;border-radius:12px;"></div>
                <h1>MOVELTY</h1>
                <p class="sub">Acceso a la plataforma — Gestión de energía</p>
                <form id="login-form" autocomplete="off">
                    <div class="login-field">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" placeholder="admin" required>
                    </div>
                    <div class="login-field">
                        <label for="password">Clave</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div id="login-error" class="login-error">Usuario o clave incorrectos. Inténtalo de nuevo.</div>
                    <button type="submit" class="login-btn">Entrar</button>
                </form>
                <p class="login-footer-text">Solo personal autorizado — MOVELTY EnergyTech</p>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-bottom">
                <p>© 2026 MOVELTY | EnergyTech</p>
            </div>
        </footer>
    </div>
</body>
</html>
