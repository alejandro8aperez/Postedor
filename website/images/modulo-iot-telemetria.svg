<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900mm" height="300mm" viewBox="0 0 900 300" version="1.1">
  <style>
    .t { font-family: Arial, Helvetica, sans-serif; }
    .title { font-size: 12px; font-weight: bold; fill: #4A148C; }
    .sub { font-size: 8px; fill: #666; }
    .hdr { font-size: 9px; font-weight: bold; fill: #4A148C; }
    .lbl { font-size: 7px; fill: #333; }
    .lblw { font-size: 6.5px; fill: #fff; }
    .small { font-size: 6px; fill: #666; }
    .wire { stroke: #0b5394; stroke-width: 1; fill: none; }
    .box { fill: #e3f2fd; stroke: #0b5394; stroke-width: 1; }
    .boxw { fill: #0b5394; }
    .sensor { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 1; }
    .arrow { fill: #0b5394; }
  </style>

  <text x="10" y="20" class="t title">RED PRIVADA TELEMÉTRICA DEL POSTEDOR — SENSORES, COMUNICACIÓN Y SEGURIDAD</text>
  <text x="10" y="33" class="t sub">Sensores aislados galvánicamente · Adquisición por el gateway · cifrado TLS 1.3 · Telemedición y telecontrol hacia EPM · Anonimización según Ley 1581 de 2012</text>

  <!-- ===== SENSORES EN EL POSTE (izquierda) ===== -->
  <text x="20" y="58" class="t hdr">A) SENSORIZACIÓN EN EL POSTE</text>
  <g transform="translate(30,72)">
    <!-- poste -->
    <path d="M60,0 L170,0 L158,140 L44,140 Z" fill="#eceff1" stroke="#666" stroke-width="1"/>

    <!-- Transformador -->
    <rect x="80" y="8" width="70" height="22" rx="3" fill="#ef9a9a" stroke="#b71c1c"/>
    <text x="115" y="22" class="t lbl" text-anchor="middle">Transformador toroidal</text>
    <!-- PT100 -->
    <circle cx="112" cy="36" r="6" fill="#6a1b9a"/>
    <text x="112" y="39" class="t lblw" text-anchor="middle">PT100</text>

    <!-- barra primario/secundario -->
    <line x1="48" y1="55" x2="182" y2="55" stroke="#b71c1c" stroke-width="2"/>
    <text x="49" y="66" class="t small">7620 V primario</text>

    <!-- CTs tensión -->
    <circle cx="70" cy="80" r="8" fill="none" stroke="#6a1b9a" stroke-width="1.5"/>
    <circle cx="160" cy="80" r="8" fill="none" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="62" y="95" class="t small">CT V</text>
    <text x="157" y="95" class="t small">CT V</text>
    <!-- CTs corriente -->
    <circle cx="104" cy="80" r="8" fill="none" stroke="#6a1b9a" stroke-width="1.5"/>
    <circle cx="126" cy="80" r="8" fill="none" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="98" y="95" class="t small">CT A</text>
    <text x="122" y="95" class="t small">CT A</text>

    <!-- ambiental -->
    <rect x="80" y="108" width="70" height="18" rx="3" fill="#f3e5f5" stroke="#6a1b9a"/>
    <text x="115" y="120" class="t lbl" text-anchor="middle">T / Humedad / P</text>
  </g>

  <!-- ===== CADENA DE MEDICIÓN (centro) ===== -->
  <text x="330" y="58" class="t hdr">B) CADENA DE MEDICIÓN</text>
  <g transform="translate(330,72)">
    <!-- sensores -->
    <rect x="0" y="30" width="110" height="60" rx="5" class="sensor"/>
    <text x="55" y="52" class="t lbl" text-anchor="middle">Sensores</text>
    <text x="55" y="63" class="t lbl" text-anchor="middle">CTs / PT100 /</text>
    <text x="55" y="74" class="t lbl" text-anchor="middle">ambiental</text>

    <!-- acondicionamiento -->
    <rect x="150" y="30" width="110" height="60" rx="5" class="box"/>
    <text x="205" y="52" class="t lbl" text-anchor="middle">Acondicionador</text>
    <text x="205" y="63" class="t lbl" text-anchor="middle">señal + ADC</text>
    <text x="205" y="74" class="t lbl" text-anchor="middle">aislamiento</text>

    <!-- gateway -->
    <rect x="300" y="30" width="110" height="60" rx="5" class="boxw"/>
    <text x="355" y="52" class="t lblw" text-anchor="middle">Gateway IoT</text>
    <text x="355" y="63" class="t lblw" text-anchor="middle">adquisición +</text>
    <text x="355" y="74" class="t lblw" text-anchor="middle">cifrado TLS 1.3</text>

    <!-- flechas -->
    <line x1="110" y1="60" x2="148" y2="60" class="wire"/>
    <polygon points="143,56 157,60 143,64" class="arrow"/>
    <line x1="260" y1="60" x2="298" y2="60" class="wire"/>
    <polygon points="293,56 307,60 293,64" class="arrow"/>

    <text x="55" y="102" class="t small" text-anchor="middle">tipo señal: mA / V/ RTD</text>
    <text x="205" y="102" class="t small" text-anchor="middle">4–20 mA / RTD PT100</text>
    <text x="355" y="102" class="t small" text-anchor="middle">Modbus TCP/IP · MQTT</text>
  </g>

  <!-- ===== DESTINO (derecha) ===== -->
  <text x="600" y="58" class="t hdr">C) DESTINO DE LOS DATOS</text>
  <g transform="translate(600,72)">
    <!-- EPM -->
    <rect x="0" y="30" width="150" height="60" rx="5" fill="#0b5394"/>
    <text x="75" y="52" class="t lblw" text-anchor="middle">EPM — Centros de control</text>
    <text x="75" y="63" class="t lblw" text-anchor="middle">(13.2 kV red de distribución)</text>
    <text x="75" y="74" class="t lblw" text-anchor="middle">telemedición · telecontrol</text>
    <line x1="130" y1="90" x2="130" y2="150" class="wire"/>
    <polygon points="126,144 134,144 130,154" class="arrow"/>
    <!-- inteligencia / analitica -->
    <rect x="20" y="155" width="110" height="40" rx="5" class="box"/>
    <text x="75" y="172" class="t lbl" text-anchor="middle">Analítica / Alerta</text>
    <text x="75" y="183" class="t lbl" text-anchor="middle">temprana</text>
    <!-- blockchain -->
    <rect x="20" y="210" width="110" height="40" rx="5" class="sensor"/>
    <text x="75" y="227" class="t lbl" text-anchor="middle">Blockchain Polygon</text>
    <text x="75" y="238" class="t lbl" text-anchor="middle">pagos / trazabilidad</text>
  </g>

  <g transform="translate(20,270)">
    <rect x="0" y="-5" width="9" height="9" fill="#6a1b9a" stroke="#333" stroke-width="0.5"/>
    <text x="12" y="2" class="t lbl">Sensores del módulo IoT</text>
    <rect x="150" y="-5" width="9" height="9" fill="#0b5394" stroke="#333" stroke-width="0.5"/>
    <text x="162" y="2" class="t lbl">Gateway / EPM</text>
    <rect x="290" y="-5" width="9" height="9" fill="#b71c1c" stroke="#333" stroke-width="0.5"/>
    <text x="302" y="2" class="t lbl">Transformador / CTs de potencia</text>
  </g>
</svg>