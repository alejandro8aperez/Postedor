<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900mm" height="300mm" viewBox="0 0 900 300" version="1.1">
  <style>
    .t { font-family: Arial, Helvetica, sans-serif; }
    .title { font-size: 12px; font-weight: bold; fill: #4A148C; }
    .sub { font-size: 8px; fill: #666; }
    .hdr { font-size: 9px; font-weight: bold; fill: #4A148C; }
    .lbl { font-size: 7px; fill: #333; }
    .lblw { font-size: 6.5px; fill: #fff; }
    .good { font-size: 7px; fill: #1b5e20; }
    .wire { stroke: #7b1fa2; stroke-width: 1; fill: none; }
    .dash { stroke: #7b1fa2; stroke-width: 1; stroke-dasharray: 3 2; fill: none; }
    .box { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1; }
    .boxw { fill: #6a1b9a; }
  </style>

  <!-- Titulo -->
  <text x="10" y="20" class="t title">MÓDULO B — IOT / TELEMETRÍA (2.5 – 4.5 m SOBRE EL POSTE)</text>
  <text x="10" y="33" class="t sub">Monitoreo remoto de todas las variables del MOVELTY · SIM Claro 4G/5G M2M → EPM · Modbus TCP/IP y MQTT con TLS 1.3 · Blockchain (Polygon L2) para pagos</text>

  <!-- ===== VISTA EN EL POSTE (izquierda) ===== -->
  <text x="20" y="58" class="t hdr">A) UBICACIÓN EN EL POSTE</text>
  <g transform="translate(40,72)">
    <!-- poste cónico simplificado -->
    <path d="M80,-70 L170,-70 L178,0 L182,55 L68,55 L72,0 Z" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
    <!-- zona D -->
    <text x="125" y="-50" class="t lbl" text-anchor="middle">D — MT / Paneles</text>
    <line x1="60" y1="0" x2="190" y2="0" class="dash"/>
    <!-- zona C -->
    <path d="M72,0 L178,0 L180,28 L70,28 Z" fill="#ef9a9a" stroke="#b71c1c" stroke-width="0.8"/>
    <text x="125" y="18" class="t lbl" text-anchor="middle">C — Transformador</text>
    <line x1="60" y1="28" x2="192" y2="28" class="dash"/>
    <text x="196" y="31" class="t lbl">6.0 m</text>
    <!-- zona B IoT -->
    <path d="M70,28 L180,28 L184,55 L66,55 Z" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1.2"/>
    <text x="123" y="46" class="t lblw" text-anchor="middle">B — MÓDULO IoT</text>
    <line x1="64" y1="55" x2="186" y2="55" class="dash"/>
    <text x="190" y="58" class="t lbl">2.5 m</text>
    <!-- zona A -->
    <path d="M66,55 L184,55 L190,110 L60,110 Z" fill="#ffcc80" stroke="#e65100" stroke-width="0.8"/>
    <text x="123" y="88" class="t lbl" text-anchor="middle">A — Cargador EV</text>
    <!-- piso -->
    <line x1="40" y1="110" x2="210" y2="110" stroke="#333" stroke-width="1.2"/>
  </g>

  <!-- ===== ESQUEMA INTERNO DEL MÓDULO (centro-derecha) ===== -->
  <text x="300" y="58" class="t hdr">B) ESQUEMA INTERNO DEL MÓDULO IoT</text>

  <g transform="translate(300,72)">
    <!-- Caja del módulo -->
    <rect x="0" y="0" width="250" height="140" rx="6" class="box"/>
    <text x="125" y="14" class="t lbl" text-anchor="middle" font-weight="bold">MOVELTY — Módulo IoT</text>

    <!-- Controlador / gateway -->
    <rect x="75" y="24" width="100" height="30" rx="4" fill="#6a1b9a"/>
    <text x="125" y="39" class="t lblw" text-anchor="middle">Gateway / PLC</text>
    <text x="125" y="49" class="t lblw" text-anchor="middle">+ SIM Claro M2M</text>

    <!-- Sensores conectados -->
    <!-- Tensión -->
    <rect x="10" y="78" width="90" height="18" rx="3" class="box"/>
    <text x="55" y="90" class="t lbl" text-anchor="middle">CTs tensión (7620/240 V)</text>
    <!-- Corriente -->
    <rect x="10" y="100" width="90" height="18" rx="3" class="box"/>
    <text x="55" y="112" class="t lbl" text-anchor="middle">CTs corriente por fase</text>
    <!-- Temperatura -->
    <rect x="10" y="122" width="90" height="18" rx="3" class="box"/>
    <text x="55" y="134" class="t lbl" text-anchor="middle">PT100 núcleo</text>
    <!-- Humedad/presión -->
    <rect x="150" y="78" width="90" height="18" rx="3" class="box"/>
    <text x="195" y="90" class="t lbl" text-anchor="middle">Humedad / presión</text>
    <!-- Energía -->
    <rect x="150" y="100" width="90" height="18" rx="3" class="box"/>
    <text x="195" y="112" class="t lbl" text-anchor="middle">Medidor bidireccional</text>
    <!-- Cargador (contacto digital) -->
    <rect x="150" y="122" width="90" height="18" rx="3" class="box"/>
    <text x="195" y="134" class="t lbl" text-anchor="middle">Cargador EV (OCPP)</text>

    <!-- Cables sensores -> gateway -->
    <line x1="55" y1="78" x2="110" y2="54" class="wire"/>
    <line x1="55" y1="100" x2="105" y2="54" class="wire"/>
    <line x1="55" y1="122" x2="100" y2="54" class="wire"/>
    <line x1="195" y1="78" x2="140" y2="54" class="wire"/>
    <line x1="195" y1="100" x2="140" y2="54" class="wire"/>
    <line x1="195" y1="122" x2="140" y2="54" class="wire"/>

    <!-- Salida de comunicación -->
    <line x1="125" y1="54" x2="125" y2="140" class="dash"/>
    <text x="130" y="152" class="t lbl">Modbus TCP/IP · MQTT TLS 1.3</text>
  </g>

  <!-- ===== FLUJO DE TELEMETRÍA (derecha) ===== -->
  <text x="600" y="58" class="t hdr">C) FLUJO DE DATOS Y CONECTIVIDAD</text>

  <g transform="translate(600,72)">
    <!-- Módulo -->
    <rect x="0" y="20" width="130" height="34" rx="5" class="boxw"/>
    <text x="65" y="40" class="t lblw" text-anchor="middle">Módulo IoT</text>
    <!-- Red móvil -->
    <rect x="175" y="20" width="130" height="34" rx="5" class="box"/>
    <text x="240" y="34" class="t lbl" text-anchor="middle">SIM Claro</text>
    <text x="240" y="45" class="t lbl" text-anchor="middle">4G / 5G M2M</text>
    <!-- EPM -->
    <rect x="350" y="20" width="130" height="34" rx="5" fill="#0b5394"/>
    <text x="415" y="34" class="t lblw" text-anchor="middle">EPM</text>
    <text x="415" y="45" class="t lblw" text-anchor="middle">telemedición/telecontrol</text>
    <!-- flechas -->
    <line x1="130" y1="37" x2="173" y2="37" class="wire"/>
    <polygon points="168,33 182,37 168,41" fill="#7b1fa2"/>
    <line x1="305" y1="37" x2="348" y2="37" class="wire"/>
    <polygon points="343,33 357,37 343,41" fill="#7b1fa2"/>

    <!-- Blockchain / pagos -->
    <rect x="0" y="90" width="130" height="34" rx="5" class="box"/>
    <text x="65" y="104" class="t lbl" text-anchor="middle">Smart Contract</text>
    <text x="65" y="115" class="t lbl" text-anchor="middle">Polygon L2</text>
    <rect x="175" y="90" width="130" height="34" rx="5" class="box"/>
    <text x="240" y="104" class="t lbl" text-anchor="middle">Medios de pago</text>
    <text x="240" y="115" class="t lbl" text-anchor="middle">Tarjeta EPM / débito</text>
    <text x="240" y="124" class="t lbl" text-anchor="middle">/ crédito / USDC · POST</text>
    <line x1="65" y1="54" x2="86" y2="88" class="dash"/>
    <polygon points="81,84 92,88 81,92" fill="#7b1fa2"/>
    <line x1="240" y1="54" x2="228" y2="88" class="dash"/>
    <polygon points="228,84 226,92 236,88" fill="#7b1fa2"/>
  </g>

  <!-- Leyenda -->
  <g transform="translate(20,270)">
    <rect x="0" y="-5" width="9" height="9" fill="#ce93d8" stroke="#6a1b9a" stroke-width="0.5"/>
    <text x="12" y="2" class="t lbl">Parte B — Módulo IoT (2.5 – 4.5 m)</text>
    <rect x="200" y="-5" width="9" height="9" fill="#0b5394" stroke="#333" stroke-width="0.5"/>
    <text x="212" y="2" class="t lbl">EPM (operador de red)</text>
    <rect x="330" y="-5" width="9" height="9" fill="#6a1b9a" stroke="#333" stroke-width="0.5"/>
    <text x="342" y="2" class="t lbl">Gateway / PLC del módulo</text>
  </g>
</svg>